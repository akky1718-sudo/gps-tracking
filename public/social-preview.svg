    </text>

    <rect x="470" width="250" height="42" rx="21" fill="#1E293B" />
    <text x="495" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#F472B6">
