<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0B132B" />
  <!-- Background radial subtle glow -->
  <circle cx="950" cy="200" r="400" fill="#1D4ED8" fill-opacity="0.25" filter="blur(80px)" />
  <circle cx="200" cy="500" r="300" fill="#2563EB" fill-opacity="0.15" filter="blur(80px)" />

  <!-- App Brand Icon -->
  <g transform="translate(100, 160)">
    <rect width="90" height="90" rx="24" fill="#2563EB" />
    <path d="M45 15C32.85 15 23 24.85 23 37C23 52 45 68 45 68C45 68 67 52 67 37C67 24.85 57.15 15 45 15Z" fill="white" />
    <circle cx="45" cy="34" r="7" fill="#DC2626" />
  </g>

  <!-- Typography -->
  <text x="215" y="210" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">
    Exact<tspan fill="#3B82F6">Pin</tspan>
  </text>
  <text x="215" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#94A3B8" letter-spacing="1">
    PRECISION DELIVERY UTILITY
  </text>

  <!-- Main Headline -->
  <text x="100" y="340" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#F8FAFC" letter-spacing="-1">
    Pin your place.
  </text>
  <text x="100" y="405" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#60A5FA" letter-spacing="-1">
    Make every delivery easier.
  </text>

  <!-- Subheadline -->
  <text x="100" y="470" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
